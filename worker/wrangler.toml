# Production Worker desanya-order-api is live.
# Do not run wrangler deploy from this checkout. Deployment is handled separately.
# SQLite Durable Object only. Workers KV is not the order store.
# Do not enable Workers Paid. See worker/README.md.
name = "desanya-order-api"
main = "src/index.js"
compatibility_date = "2026-11-05"
workers_dev = true

[durable_objects]
bindings = [
  { name = "ORDER_LEDGER", class_name = "OrderLedger" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrderLedger"]

[vars]
# Set these in the Cloudflare dashboard for a sandbox preview, not in git.
# PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"
# ALLOWED_ORIGINS must be a preview origin until a later cutover.
# ALLOWED_ORIGINS = "https://preview.example"
